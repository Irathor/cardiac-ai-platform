name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  ml:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install ml package
        working-directory: ml
        run: pip install -e ".[dev]"
      - name: Lint
        working-directory: ml
        run: ruff check .
      - name: Run ml tests
        working-directory: ml
        run: pytest
      - name: Audit ml dependencies (pip-audit)
        working-directory: ml
        run: |
          pip install pip-audit
          # pip-audit has no native --severity flag (unlike `npm audit
          # --audit-level`, OSV/PyPA advisory data doesn't consistently carry
          # a CVSS score to filter on) — it fails on any known vulnerability
          # found in the currently installed environment. See EPIC-5 summary
          # for the real findings at the time this gate was introduced and
          # which ones the team accepted vs. needs to triage.
          pip-audit --local

  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install ml package
        run: pip install -e ./ml
      - name: Install backend
        working-directory: backend
        run: pip install -e ".[dev]"
      - name: Lint
        working-directory: backend
        run: ruff check .
      - name: Run backend tests
        working-directory: backend
        run: pytest
      - name: Audit backend dependencies (pip-audit)
        run: |
          pip install pip-audit
          # Same caveat as the ml job's audit step above: no severity
          # filter available, this fails on any known vulnerability.
          #
          # PYSEC-2026-1325 (GHSA-wj6h-64fc-37mp, "Minerva" timing attack on
          # P-256) is ignored deliberately, not silenced blindly: it affects
          # `ecdsa`, a transitive dependency of python-jose[cryptography]
          # (still required even with the cryptography extra — see
          # python-jose's setup.py). ecdsa 0.19.2 is the latest release on
          # PyPI as of this gate (verified 2026-09) and there is no patched
          # version — the python-ecdsa maintainers explicitly document that
          # side-channel/timing attacks are outside python-ecdsa's threat
          # model for the pure-Python implementation (see their README).
          # Revisit if a fixed release ever ships, or consider dropping
          # python-jose's plain ecdsa backend in favor of one that shells
          # out to `cryptography` exclusively (fast-follow, see BACKLOG.md).
          pip-audit --local --ignore-vuln PYSEC-2026-1325

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend
        working-directory: frontend
        run: npm install
      - name: Audit frontend dependencies (npm audit)
        working-directory: frontend
        run: npm audit --audit-level=high
      - name: Lint
        working-directory: frontend
        run: npm run lint
      - name: Type-check
        working-directory: frontend
        run: npx tsc -b
      - name: Run frontend unit tests
        working-directory: frontend
        run: npm test
      - name: Build
        working-directory: frontend
        run: npm run build

  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate docker-compose.yml
        run: |
          cp .env.example .env
          docker compose config -q
      - name: Build and start the full stack
        run: docker compose up -d --build
      - name: Wait for backend readiness
        run: |
          for i in $(seq 1 60); do
            if curl -sf http://localhost:8000/api/v1/health/ready; then exit 0; fi
            sleep 2
          done
          echo "backend never became ready" && docker compose logs && exit 1
      - name: Apply migrations and seed demo data
        run: |
          docker compose exec -T backend alembic upgrade head
          docker compose exec -T backend python -m app.scripts.seed_demo
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: tests/package-lock.json
      - name: Install Playwright
        working-directory: tests
        run: |
          npm ci
          npx playwright install --with-deps chromium
      - name: Run e2e tests
        working-directory: tests
        run: npm test
      - name: Dump container logs on failure
        if: failure()
        run: docker compose logs

  # Builds the backend/frontend images on every push and PR (catches Dockerfile
  # breakage early) but only publishes (push: true) to GHCR on push to master —
  # never from a feature-branch PR. Depends on the test jobs so a broken build
  # or failing test never gets an image published.
  build-and-push:
    runs-on: ubuntu-latest
    needs: [ml, backend, frontend]
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        include:
          - image: backend
            context: .
            dockerfile: backend/Dockerfile
          - image: frontend
            context: ./frontend
            dockerfile: frontend/Dockerfile
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Compute lowercase image repository (GHCR requires lowercase)
        run: echo "REPO_LC=$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_ENV"
      - name: Log in to GHCR
        if: github.event_name == 'push' && github.ref == 'refs/heads/master'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push ${{ matrix.image }} image
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          push: ${{ github.event_name == 'push' && github.ref == 'refs/heads/master' }}
          tags: |
            ghcr.io/${{ env.REPO_LC }}/${{ matrix.image }}:${{ github.sha }}
            ghcr.io/${{ env.REPO_LC }}/${{ matrix.image }}:latest

name: cardiac-ai-platform

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-cardiac_ai}
      POSTGRES_USER: ${POSTGRES_USER:-cardiac_ai}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./infrastructure/postgres/init-mlflow-db.sql:/docker-entrypoint-initdb.d/init-mlflow-db.sql:ro
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-cardiac_ai}"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  minio:
    # MinIO removed the minio/minio repo from Docker Hub entirely (Sep 2026)
    # — quay.io/minio/minio serves the identical image at the same digest,
    # publicly, no login required.
    image: quay.io/minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY:?MINIO_ACCESS_KEY is required}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY:?MINIO_SECRET_KEY is required}
    volumes:
      - minio_data:/data
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 3s
      retries: 10

  mlflow:
    build: ./infrastructure/mlflow
    environment:
      MLFLOW_BACKEND_STORE_URI: postgresql://${POSTGRES_USER:-cardiac_ai}:${POSTGRES_PASSWORD}@postgres:5432/mlflow
      MLFLOW_ARTIFACT_ROOT: s3://mlflow-artifacts
      AWS_ACCESS_KEY_ID: ${MINIO_ACCESS_KEY}
      AWS_SECRET_ACCESS_KEY: ${MINIO_SECRET_KEY}
      MLFLOW_S3_ENDPOINT_URL: http://minio:9000
      # mlflow>=3's server rejects any Host header outside its own
      # localhost/private-IP allowlist by default (DNS-rebinding
      # protection) — a Docker Compose service-name hostname like
      # "mlflow:5000" (what every real caller, backend/worker, sends)
      # isn't a localhost or IP literal, so it's rejected with 403
      # "Invalid Host header" otherwise. Found post-EPIC-5 (the mlflow
      # 3.16.1 upgrade) via EPIC-6's full docker-compose e2e checkpoint —
      # no prior verification exercised the real compose network path.
      # Allowlist only the one real hostname this server is ever reached
      # at from inside this stack (127.0.0.1:5000 stays open to the host
      # for local debugging via the healthcheck/manual curl, already
      # covered by the default localhost allowlist).
      MLFLOW_SERVER_ALLOWED_HOSTS: mlflow:5000
    ports:
      - "127.0.0.1:5000:5000"
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
    healthcheck:
      # curl isn't installed in this image (see infrastructure/mlflow/Dockerfile) — reuse
      # the same Python check the Dockerfile's own HEALTHCHECK uses.
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:5000/health')"]
      interval: 10s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    env_file: .env
    environment:
      POSTGRES_HOST: postgres
      REDIS_HOST: redis
      MINIO_ENDPOINT: minio:9000
      MLFLOW_TRACKING_URI: http://mlflow:5000
      # EPIC-6: shared with `worker` (same path, same volume) so
      # prometheus_client's multiprocess mode can merge CNN3D metrics
      # recorded in the worker process into this process's /metrics
      # response — see backend/app/core/metrics.py.
      PROMETHEUS_MULTIPROC_DIR: /tmp/prometheus_multiproc
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    volumes:
      - ./backend/app:/srv/app
      - ./backend/tests:/srv/tests
      - ./ml/cardiac_ai_ml:/ml/cardiac_ai_ml
      - ./data:/data
      - prometheus_multiproc:/tmp/prometheus_multiproc

  worker:
    build:
      context: .
      dockerfile: backend/Dockerfile
    command: celery -A app.celery_app worker --loglevel=info
    env_file: .env
    environment:
      POSTGRES_HOST: postgres
      REDIS_HOST: redis
      MINIO_ENDPOINT: minio:9000
      MLFLOW_TRACKING_URI: http://mlflow:5000
      # EPIC-6: same path/volume as `backend` — see that service's own
      # comment on PROMETHEUS_MULTIPROC_DIR.
      PROMETHEUS_MULTIPROC_DIR: /tmp/prometheus_multiproc
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
      mlflow:
        condition: service_healthy
    volumes:
      - ./backend/app:/srv/app
      - ./ml/cardiac_ai_ml:/ml/cardiac_ai_ml
      - ./data:/data
      - prometheus_multiproc:/tmp/prometheus_multiproc
    healthcheck:
      # Overrides the backend image's HTTP-based HEALTHCHECK (see backend/Dockerfile) —
      # this container runs a Celery worker, not the web server, so there's nothing on :8000.
      test: ["CMD", "celery", "-A", "app.celery_app", "inspect", "ping"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 15s

  frontend:
    build: ./frontend
    environment:
      VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://localhost:8000/api/v1}
    ports:
      - "127.0.0.1:5173:4173"
    depends_on:
      - backend

  # EPIC-8/ADR-6: the single public entry point to the stack. Binds
  # 0.0.0.0:80/443 (NOT 127.0.0.1 like every other service in this file) —
  # this is a deliberate exception to the project's usual "bind to
  # loopback, never expose directly" convention, because Caddy IS the
  # thing meant to be reachable from the public Internet: it terminates
  # TLS and reverse-proxies internally to frontend/backend over the
  # Docker network, so they never need their own public port.
  caddy:
    image: caddy:2.10-alpine
    ports:
      - "80:80"
      - "443:443"
    environment:
      # Resolved by Terraform's cloud-init on the real deployment (see
      # infrastructure/terraform/oracle/cloud-init.tftpl) from the
      # instance's own public IP as "<ip-with-dashes>.sslip.io". Locally,
      # set CADDY_HOSTNAME=localhost in .env if you want to exercise this
      # service without a public IP (Caddy issues a local, not
      # publicly-trusted, TLS cert in that case).
      CADDY_HOSTNAME: ${CADDY_HOSTNAME:?CADDY_HOSTNAME is required}
    volumes:
      - ./infrastructure/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - frontend
      - backend

  prometheus:
    image: prom/prometheus:v3.13.3
    volumes:
      - ./infrastructure/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    ports:
      - "127.0.0.1:9090:9090"
    depends_on:
      - backend

  grafana:
    image: grafana/grafana:13.2.2
    environment:
      # Required, no factory-default fallback — same convention as
      # POSTGRES_PASSWORD/MINIO_SECRET_KEY above. Found by security-review
      # at EPIC-6's close checkpoint: every other credentialed service in
      # this compose file fails fast without its own secret; Grafana was
      # the one left on the well-known admin/admin default.
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?GRAFANA_ADMIN_PASSWORD is required}
    volumes:
      - ./infrastructure/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./infrastructure/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana_data:/var/lib/grafana
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      - prometheus

volumes:
  postgres_data:
  minio_data:
  caddy_data:
  caddy_config:
  prometheus_data:
  grafana_data:
  # EPIC-6: shared between `backend` and `worker` for
  # prometheus_client's multiprocess mode (PROMETHEUS_MULTIPROC_DIR) —
  # see backend/app/core/metrics.py.
  prometheus_multiproc:

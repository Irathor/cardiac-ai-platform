[project]
name = "cardiac-ai-backend"
version = "0.1.0"
description = "CardiacAI Research Platform — Clinical API (research prototype, not for clinical use)"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115,<0.116",
    "uvicorn[standard]>=0.32,<0.33",
    "pydantic>=2.9,<3",
    "email-validator>=2.2,<3",
    "pydantic-settings>=2.5,<3",
    "sqlalchemy>=2.0,<2.1",
    "alembic>=1.13,<2",
    "psycopg[binary]>=3.2,<4",
    "redis>=5.1,<6",
    "celery>=5.4,<6",
    "python-jose[cryptography]>=3.3,<4",
    "argon2-cffi>=23.1,<24",
    "python-multipart>=0.0.12,<0.1",
    "boto3>=1.35,<2",
    "nibabel>=5.3,<6",
    "mlflow>=2.17,<3",
    "cardiac-ai-ml",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3,<9",
    "pytest-asyncio>=0.24,<0.25",
    "httpx>=0.27,<0.28",
    "ruff>=0.7,<0.8",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

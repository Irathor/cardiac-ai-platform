[project]
name = "cardiac-ai-ml"
version = "0.1.0"
description = "CardiacAI Research Platform — segmentation/biomarker math (research prototype, not for clinical use)"
requires-python = ">=3.12"
dependencies = [
    "numpy>=2.1,<3",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3,<9",
    "ruff>=0.7,<0.8",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["cardiac_ai_ml*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
